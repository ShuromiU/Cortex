action_items:
  - epic: 5
    action: "The story's own Verification block is self-contradictory and needs a ruling. It says 'review anything that changes unattended behaviour BEFORE the rebuild that ships it' (the Epic 4 lesson, where a broken auto-cleanup reached 3 of 36 live stores) AND it requires live end-to-end proof on the real installation — which is unobtainable without building, because this checkout's dist/ IS the live install for the whole machine. Story 5.1 hit exactly that: the rebuild shipped before the three-layer review, which the Acceptance Auditor correctly flagged. Mitigating facts specific to this story: the change is purely additive (a new hook event, no existing path altered), the only user-visible effect before install was `doctor` FAILING loudly with a named fix rather than degrading silently, and the two HIGH defects found in review were both in an observability row that can only produce a false WARN, never data loss. Candidate shapes: (a) allow the rebuild for live proof but require the review to run against the working tree BEFORE `cortex install` wires anything machine-wide — which is what effectively happened here, since only this repo was engaged; (b) require live proof in a sandboxed CORTEX_HOME + temp project, accepting that it does not exercise the real host hook; (c) split the story's Verification into 'build+prove in sandbox, review, then install machine-wide' as three ordered gates."
    owner: "ShuromiU (process decision)"
    status: done  # 2026-08-06 RULING (ShuromiU): THREE ORDERED GATES, candidate shape (c). (1) Build and prove in a sandboxed CORTEX_HOME + temp project — the real rendered hook against a real store, just not the live one; (2) run the three-layer review; (3) only then `cortex install` to wire it machine-wide. Rationale: keeps the Epic 4 protection intact (a broken auto-cleanup reached 3 of 36 live stores) while still getting real proof, at the cost of one extra step per story. Explicitly acknowledged limitation: a sandbox cannot catch a defect that only appears against the real settings file or the real host, which is why gate 3 remains a live install and not a simulation — and why Story 5.1's most important finding (the host writes the subagent's dispatch description strictly AFTER the SubagentStart hook returns) could only have come from a live probe. Rejected: 'review the working copy before installing' (cheapest, but leaves unreviewed code running in this project) and 'sandbox only, never live' (would have missed the sidecar-timing finding entirely).
  - epic: 5
    action: "SubagentStart has NO budget and needs a ruling. B-4 is scoped in PRD §10 to the non-substituting PostToolUse path (Edit/Write/Bash/Agent); B-4a covers Read substitution; B-1 the brief; B-3 queries; B-7 doctor. None covers this event, so Story 5.1 built to the structural clause unconditionally (one Node spawn per DISPATCH never per tool call, one jq, no SQLite in bash, no network, nothing blocking on a file, engagement guard before dispatch — all CI-pinned) and reported the wall clock rather than claiming a budget that does not exist. MEASURED through the rendered hook, quiescent, 60 runs after 5 warmup, real git repo + real store, work asserted to have happened (65 dispatches -> 65 sessions -> 65 fires): min 480.7 / median 514.8 / p95 587.4 ms, against a bash spawn floor of median 37.4 / p95 57.5 ms. Node startup dominates, exactly as it does for reflect-pre. Deciding facts for the ruling: the event fires once per subagent (56 dispatches in four days on this repo against 4,881 captured commands), it CANNOT block the subagent (host renders exit 2 as a notice and proceeds), and the host's own timeout for it is 60 s. Candidate shapes: name a new B-9 for per-dispatch hooks at <=800 ms p95 end-to-end with the structural clause primary (the B-4a precedent); or fold SubagentStart into a widened B-4; or accept the measured figure as B-3 was accepted 2026-08-03."
    owner: "ShuromiU (PRD decision)"
