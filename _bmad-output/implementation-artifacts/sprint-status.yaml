  5-1-link-subagent-sessions-to-their-parent: done # Both rulings closed 2026-08-06 (budget: measured figure accepted on the B-3 precedent; process: three ordered gates sandbox->review->install). THREE-LAYER REVIEW RECONCILED 2026-08-06: 12 fixed, 3 deferred with records, 2 dismissed, 1 ruling to ShuromiU. TWO HIGH defects, each found independently by two layers, each producing the SAME false alarm the observability row exists to prevent: (1) the first-fire marker was stamped with the resolved child's started_at, and a fire can FIND a child (getSessionByAgentId is unfiltered by parent/status per Story 0.2 AC #3), so a recycled agent_id back-dated the marker — reproduced with 21 children swept into the window, verdict WARN with a fix that repairs nothing; (2) the fire counter was a read-modify-write across independent hook processes — busy_timeout serialises writes but not read-then-write, reproduced two fires from 5 landing on 6, and each loss is PERMANENT because the marker is write-once, so one occurrence latches doctor to warn for the life of the store. Finding (2) also CONTRADICTED the story's own "the race is already handled" note, true of sessions and false of the counter it added. The fix for (2) then reintroduced the parseInt prefix trap through SQL (CAST('12 fires' AS INTEGER)=12) with a comment claiming otherwise — caught by the suite mid-round, now an all-digits GLOB guard pinned across 7 corrupt values. ALSO FIXED: a new test that would go red on EVERY fresh Windows checkout while guarding nothing (no .gitattributes + core.autocrlf; renderHookScript already normalises, so it now asserts the RENDERED output); an action default that made an arg-less wiring — the form doctor REFUSES — actually work, so install would append a second entry and every dispatch would spawn Node twice; an unguarded throw reaching the turn as a stack trace despite a ticked box promising otherwise; three structure tests hiding inside describe.skipIf; a ticked box claiming two install assertions that did not exist (de-dup was hardcoded to Stop, so SubagentStart had zero coverage — now it.each over REQUIRED_WIRING); an arithmetically impossible pool figure (1,428 of 1,952 mixed two readings; re-measured 1,433 of 1,971) whose "zero are children" is now false because this story's own live proof created the first one; and file:line citations already off by one within a day, now symbol-only. DEFERRED WITH RECORDS: cross-worktree parent adoption (getCurrentSession is store-wide; reproduced; ensureScopedSession's deliberate Epic 0 contract and the cheap fix is a git subprocess the structural clause forbids), re-fire onto an ended child for a recycled id, and cortex stats Focus:unfocused after 10 dispatches. Suite 1634 passed/1 skipped, gate 9/9 zero delta, doctor 19/19 exit 0, mutation campaign 14/14 KILLED after repairing two anchors that SURVIVED (M12: nothing proved recordSubagentStart used the atomic method; M4: two same-millisecond stamps). Re-proven live post-fix: tool_uses=0 subagent left session a88edf2cb30ba7287 with 0 events. # DEV COMPLETE 2026-08-06. SubagentStart is Cortex's 6th wired event: cortex-subagent.sh guards on engagement AND on its own action argument (an unknown action reaches the reflex path, which can CREATE a primary — a mis-wired arg would rotate the parent every dispatch), then spawns Node once per dispatch. Two silences carry the safety: no agent_id creates nothing (resolveSessionId would manufacture a primary as a side effect of a subagent event) and no active primary creates nothing (ensureScopedSession would mint one from the SUBAGENT's cwd — found by writing the test, not by reading the code). Marker keys live in scope/runtime.ts, not transports/, because doctor reads them and AD-1 forbids query->transport. Conditional doctor row stays SILENT until the path fires once: the obvious "children exist but this never ran" would have warned on day one on both stores that already hold children (40 here, 16 repo-c) — the command-outcomes flap repeated. No schema change (meta rows, SCHEMA_VERSION stays 6). DISPOSAL ANSWERED BY MEASUREMENT, not assertion: 1,428 of 1,952 live sessions are already permanently unconsolidated, 100% eventless, 0 children — pre-existing and general; loop costs 10.0 ms median for 953 sessions vs B-1's 150 ms, row is 172 bytes vs B-8's 50 MB, so it is recorded in deferred-work with numbers and an owner rather than fixed on the SessionStart path. Two test fixtures repaired: doctor.test.ts's TEMPLATE_BODIES would have killed EVERY test in the file (hand-written 3-key record consumed over HOOK_SCRIPTS), and cli.test.ts had two hardcoded 3-script loops now driven by the constant. 32 tests added, suite 1623 passed/1 skipped, gate 9/9 zero delta, doctor 19/19 exit 0, mutation campaign 10/10 KILLED (sha-proven applied and restored byte-identically; its first run honestly reported 5 anchors NOT FOUND on CRLF rather than calling them passes). LIVE E2E on the real install: a subagent with tool_uses=0 left session a405daca2e28c9e31 with events=0 cmds=0 — impossible before this story; second store (repo-c) verified silent, 18/18. OPEN: no budget covers SubagentStart (B-4 is the non-substituting PostToolUse path, B-4a is Read); measured p95 587.4 ms, Node-startup dominated, once per dispatch, cannot block the subagent, host timeout 60 s — ruling needed, see action item. # created 2026-08-06 against a3e5d48. Reduced scope CONFIRMED against Epic 0's shipped code, not assumed: AC #2 already MET (pin it, mutation-checked against store.ts:1527/:1537 — do not rebuild), AC #3 half-inherited (isEnabled gates every Node action at handleHookPayload:534; the new bash script needs its own byte-identical engagement grep), AC #1 is the work — certify_refs("SubagentStart") returns textSource 0, REQUIRED_WIRING has 5 events, HOOK_SCRIPTS has 3, HookAction has no subagent member. HOST CONTRACT MEASURED LIVE (real probe wired into ~/.claude/settings.json, 4 dispatches incl. two parallel same-type, settings restored byte-identically sha d4d66a3b): SubagentStart carries exactly 7 fields and NO dispatch description; the per-agent sidecar holding it is written strictly AFTER every SubagentStart hook returns (a 5,259 ms in-hook poll never saw it), and the parent transcript is racy at that instant (reproduced: first of two parallel agents saw a transcript without its own dispatch block). Docs claim tool_name/tool_input "if triggered by tool" — measured ABSENT on all four Agent dispatches and absent from the binary's only construction site. Consequence recorded in Appendix A: Story 5.2's only reliable source is PreToolUse(Agent), whose tool_use_id equals the sidecar toolUseId, so a start-time pairing is self-auditable at SubagentStop. Independent validation folded in before ready-for-dev: tests/doctor.test.ts CRASHES in buildFixture on a 4th HOOK_SCRIPTS entry (TEMPLATE_BODIES is a hand-written 3-key record) and does NOT iterate REQUIRED_WIRING; eventless child sessions would stay permanently unconsolidated on the B-1-budgeted inject-header loop with no GC rule (measured: 1,423 of 1,952 live sessions already unconsolidated machine-wide, but 0 of 56 children — the new row IS the advertised new capability, so this story owns its disposal per Story 0.1's precedent); the obvious doctor warn condition would misfire on day one on both stores that already hold children; ensureScopedSession mints a primary from the SUBAGENT's cwd when none is active, which AC #1's "the parent's scope_key" does not cover; and deferred-work.md lines 27/29/39 name Epic 5 / "Story 5.1 AC 2" as owner and must be re-filed. No schema change (meta table, SCHEMA_VERSION stays 6). No budget covers SubagentStart — Epic 5 must state one.
