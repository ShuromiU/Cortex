name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: `npm ci` runs lifecycle scripts from the whole dependency
# tree, including better-sqlite3's native build.
permissions:
  contents: read

# A same-repo PR otherwise runs the whole matrix twice, on push and on
# pull_request. Superseded runs are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target, not a port (N-6). The suite has only
        # ever run on Windows locally, so Linux coverage here is new information.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
        with:
          # The justification guard reads commit bodies across the range.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint

      # The declared script, not `npx vitest run`: npx would silently fetch a
      # published vitest if the devDependency were removed, and any future
      # change to the test script would never reach CI.
      - run: npm test

      # Runs against dist/, so it must follow the build.
      - name: Retrieval quality gate
        run: npm run gate

      - name: Baseline justification
        if: runner.os == 'Linux' && matrix.node == 20
        run: node scripts/check-baseline-justification.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
